
    <!-- Page Content  -->


      <div class="container-fluid">
        <div class="row dash-tab">
          <div class="col-md-12 col-sm-12">
            <div class="form-group">
               <h4>TOTAL EXPENSE : &#x20B9; <span style="color:#69d73d">{{total}}</span></h4>
            </div>
          </div>
          <div class="col-sm-4 cus-srch ">
            <div class="form-group">
              EMPLOYEE WISE
              <select name="cars" class="form-control pl-0" id="cars" [(ngModel)]="selectedEmployee" (change)="onOptionSelect($event.target.value)">
                <ng-container *ngFor="let item of employeeList">
                  <option [value]="item.id">{{item.fullName}}</option>
                </ng-container>
              </select>
             </div>
          </div>
          <div class="col-sm-3 cus-srch">
            <div class="form-group">
               FROM DATE
              <input type="date" class="form-control pl-0" id="birthday1" placeholder="From Date" [(ngModel)]="selectedStartDate" name="selectedSDate" (change)="changedDate('start',$event.target.value)">
              
            </div>
          </div> 
        <div class="col-sm-3 cus-srch">
          <div class="form-group">
             TO DATE
            <input type="date" class="form-control pl-0" id="birthday2" placeholder="To Date" [(ngModel)]="selectedEndDate" name="selectedEDate" (change)="changedDate('end',$event.target.value)">
            
          </div>
        </div> 
        <div class="col-sm-3">
            <div class="form-group mt-3">
              <button class="shortcut-btn w-100" (click)="onDateSelect()"><b>SEARCH BY DATE</b></button>
            </div>
          </div>                
                  <div class="col-sm-12">
                 <div class="table-responsive">
                  <table class="table details_table ">
                    <thead>
                      <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Particulars <a href = 'javascript:void(0)' (click)="changeOrder('expense_reason')" class="caret-sort"><i class="fa" [class.fa-caret-down]="sortFields.expense_reason" [class.fa-caret-up]="!sortFields.expense_reason"></i></a></th>
                        <th scope="col">Expense <a href = 'javascript:void(0)' (click)="changeOrder('expense_amount')" class="caret-sort"><i class="fa" [class.fa-caret-down]="sortFields.expense_amount" [class.fa-caret-up]="!sortFields.expense_amount"></i></a></th>
                        <th scope="col">Total Expense <a href = 'javascript:void(0)' (click)="changeOrder('total_expense_amount')" class="caret-sort"><i class="fa" [class.fa-caret-down]="sortFields.total_expense_amount" [class.fa-caret-up]="!sortFields.total_expense_amount"></i></a></th>
                        <th scope="col">Staff <a href = 'javascript:void(0)' (click)="changeOrder('employee_name')" class="caret-sort"><i class="fa" [class.fa-caret-down]="sortFields.employee_name" [class.fa-caret-up]="!sortFields.employee_name"></i></a></th>
                      </tr>
                    </thead>
                    <tbody *ngIf='expenseList?.length; else elseBlock'>
                      <tr *ngFor = "let item of expenseList">
                        <td>{{item.createdOn | date:'MMM d, y' }}</td>
                        <td>{{item.expense_reason}}</td>
                        <td>&#x20B9; {{item.expense_amount}}</td>
                        <td>&#x20B9; {{item.total_expense_amount}}</td>
                        <td>{{item.employee_name}}</td>
                      </tr>
                     </tbody>
                      <ng-template #elseBlock>
                        <tbody>
                          <tr>
                            <td class="text-center" colspan="100%">{{response}}</td>
                          </tr>
                        </tbody>
                      </ng-template>
                  </table>
                </div>
                </div>
                
          
        </div>
      </div>
